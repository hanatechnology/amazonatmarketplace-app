name: CD

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      platform:
        description: "Platform to deploy"
        required: true
        default: "both"
        type: choice
        options:
          - both
          - ios
          - android
      app_env:
        description: "Which env/<name>.json to compile against"
        required: true
        default: "staging"
        type: choice
        options:
          - staging
          - prod

# A second push shouldn't queue behind the first — the older build is already
# stale by the time it would upload.
concurrency:
  group: cd-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: "3.41.4"
  APP_ENV: ${{ inputs.app_env || 'staging' }}

jobs:
  # ───────────────────────────────────────────────────────────────────────────
  # iOS → TestFlight
  # ───────────────────────────────────────────────────────────────────────────
  ios:
    name: iOS → TestFlight
    if: ${{ github.event_name == 'push' || inputs.platform == 'both' || inputs.platform == 'ios' }}
    # macos-26, not macos-15: since 28 April 2026 App Store Connect rejects any
    # upload not built with Xcode 26 / the iOS 26 SDK, and the macos-15 image
    # tops out at Xcode 16.
    runs-on: macos-26
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      # Before CocoaPods — pod install generates configs against the selected SDK.
      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Cache pub packages
        uses: actions/cache@v4
        with:
          # Not .dart_tool — it stores absolute paths and does not survive a
          # different runner.
          path: ~/.pub-cache
          key: pub-${{ runner.os }}-${{ hashFiles('pubspec.lock') }}
          restore-keys: pub-${{ runner.os }}-

      - name: Install Flutter dependencies
        run: flutter pub get

      # The Maps SDK key is a native Info.plist lookup, so a dart-define cannot
      # carry it. Secrets.xcconfig is git-ignored and included by both
      # Debug.xcconfig and Release.xcconfig.
      - name: Write Secrets.xcconfig
        run: echo "MAPS_API_KEY=${{ secrets.MAPS_API_KEY_IOS }}" > ios/Flutter/Secrets.xcconfig

      # Ruby before pod install, so CocoaPods is installed under the same Ruby
      # that fastlane and flutter build ipa will use.
      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true

      - name: Cache CocoaPods
        id: pods-cache
        uses: actions/cache@v4
        with:
          path: ios/Pods
          key: pods-${{ runner.os }}-${{ hashFiles('ios/Podfile.lock') }}
          restore-keys: pods-${{ runner.os }}-

      - name: Install CocoaPods
        working-directory: ios
        run: |
          if [ "${{ steps.pods-cache.outputs.cache-hit }}" == "true" ]; then
            bundle exec pod install
          else
            bundle exec pod install --repo-update
          fi

      - name: Cache Xcode DerivedData
        uses: actions/cache@v4
        with:
          path: ~/Library/Developer/Xcode/DerivedData
          key: xcode-${{ runner.os }}-${{ hashFiles('ios/Podfile.lock', 'pubspec.lock') }}
          restore-keys: xcode-${{ runner.os }}-

      - name: Build & upload to TestFlight
        env:
          APP_ENV: ${{ env.APP_ENV }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_CONTENT: ${{ secrets.ASC_KEY_CONTENT }}
          MATCH_GIT_URL: ${{ secrets.MATCH_GIT_URL }}
          MATCH_GIT_TOKEN: ${{ secrets.MATCH_GIT_TOKEN }}
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
          GITHUB_RUN_NUMBER: ${{ github.run_number }}
        run: bundle exec fastlane ios beta

  # ───────────────────────────────────────────────────────────────────────────
  # Android → Firebase App Distribution
  # ───────────────────────────────────────────────────────────────────────────
  android:
    name: Android → Firebase App Distribution
    if: ${{ github.event_name == 'push' || inputs.platform == 'both' || inputs.platform == 'android' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Cache pub packages
        uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: pub-${{ runner.os }}-${{ hashFiles('pubspec.lock') }}
          restore-keys: pub-${{ runner.os }}-

      - name: Install Flutter dependencies
        run: flutter pub get

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('android/**/*.gradle*', 'android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true

      # The keystore and its passwords never touch the repo. build.gradle.kts
      # reads android/key.properties and falls back to debug signing when it is
      # absent — the fastlane lane fails loudly rather than shipping that.
      - name: Write signing config
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 --decode > android/app/upload-keystore.jks
          cat > android/key.properties <<EOF
          storeFile=upload-keystore.jks
          storePassword=${{ secrets.ANDROID_STORE_PASSWORD }}
          keyAlias=${{ secrets.ANDROID_KEY_ALIAS }}
          keyPassword=${{ secrets.ANDROID_KEY_PASSWORD }}
          EOF

      - name: Build & upload to Firebase App Distribution
        env:
          APP_ENV: ${{ env.APP_ENV }}
          # Native manifest placeholder; build.gradle.kts reads this env var when
          # local.properties has no key.
          MAPS_API_KEY: ${{ secrets.MAPS_API_KEY_ANDROID }}
          FIREBASE_APP_ID_ANDROID: ${{ secrets.FIREBASE_APP_ID_ANDROID }}
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          FIREBASE_TESTER_GROUPS: ${{ vars.FIREBASE_TESTER_GROUPS || 'testers' }}
          GITHUB_RUN_NUMBER: ${{ github.run_number }}
        run: bundle exec fastlane android beta

      - name: Remove keystore from runner
        if: always()
        run: rm -f android/app/upload-keystore.jks android/key.properties
